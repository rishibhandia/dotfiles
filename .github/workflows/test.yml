name: Test Dotfiles

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:  # Allow manual trigger

env:
  # chezmoi's gitHub* template functions call the GitHub API; runners share
  # unauthenticated rate limits, so authenticate every chezmoi invocation.
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  # ==========================================================================
  # Lint shell scripts
  # ==========================================================================
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Install chezmoi
        run: sh -c "$(curl -fsSL https://get.chezmoi.io)" -- -b /usr/local/bin

      - name: Initialize chezmoi
        run: chezmoi init --source="${{ github.workspace }}" --no-tty

      - name: Lint shell scripts (blocking at error severity)
        run: |
          find . -name "*.sh" -not -path "./.git/*" -print0 | xargs -0 shellcheck -S error

      - name: Lint rendered shell script templates
        run: |
          fail=0
          while IFS= read -r file; do
            rendered="$(chezmoi execute-template --source="${{ github.workspace }}" < "$file")"
            # Machine-gated scripts render empty off their machine - skip those
            if [ -z "$(printf '%s' "$rendered" | tr -d '[:space:]')" ]; then
              echo "Skipping $file (renders empty for this machine class)"
              continue
            fi
            echo "Checking $file"
            if ! printf '%s\n' "$rendered" | shellcheck -S error -; then
              echo "::error file=${file}::shellcheck failed on rendered template"
              fail=1
            fi
          done < <(find . -name "*.sh.tmpl" -not -path "./.git/*" | sort)
          exit "$fail"

      - name: Shell script warnings (advisory)
        run: |
          find . -name "*.sh" -not -path "./.git/*" -print0 | xargs -0 shellcheck -S warning \
            || echo "::warning::shellcheck reported warnings (non-blocking)"

      - name: Lint with shfmt
        uses: luizm/action-sh-checker@v0.10.0
        env:
          SHFMT_OPTS: -i 4 -ci
        with:
          sh_checker_shellcheck_disable: true
          sh_checker_shfmt_disable: false
        continue-on-error: true

  # ==========================================================================
  # Test on macOS
  # ==========================================================================
  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install chezmoi
        run: |
          brew install chezmoi

      # chezmoi init does NOT persist a non-default --source, so every
      # invocation below passes it explicitly.
      - name: Initialize chezmoi
        run: chezmoi init --source="${{ github.workspace }}" --no-tty

      - name: Render full target state
        run: chezmoi diff --source="${{ github.workspace }}"

      - name: Apply dotfiles (files only)
        run: chezmoi apply --source="${{ github.workspace }}" --exclude=scripts,externals

      - name: Verify applied state
        run: chezmoi verify --source="${{ github.workspace }}" --exclude=scripts,externals

      - name: Test install script syntax
        run: |
          bash -n install.sh

      - name: Validate Brewfile syntax
        run: |
          # Render the Brewfile template, then have brew parse it.
          # 'brew bundle list' evaluates the Ruby DSL without installing.
          chezmoi cat --source="${{ github.workspace }}" ~/.Brewfile > "$RUNNER_TEMP/Brewfile"
          brew bundle list --all --file="$RUNNER_TEMP/Brewfile" > /dev/null
          echo "Brewfile renders and parses"

      - name: Run tests
        run: DOTFILES_CI=1 bash scripts/test.sh

  # ==========================================================================
  # Test on Ubuntu
  # ==========================================================================
  ubuntu:
    name: Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install chezmoi
        run: |
          sh -c "$(curl -fsSL https://get.chezmoi.io)" -- -b /usr/local/bin

      - name: Initialize chezmoi
        run: chezmoi init --source="${{ github.workspace }}" --no-tty

      - name: Render full target state
        run: chezmoi diff --source="${{ github.workspace }}"

      - name: Apply dotfiles (files only)
        run: chezmoi apply --source="${{ github.workspace }}" --exclude=scripts,externals

      - name: Verify applied state
        run: chezmoi verify --source="${{ github.workspace }}" --exclude=scripts,externals

      - name: Test install script syntax
        run: |
          bash -n install.sh

      - name: Run tests
        run: DOTFILES_CI=1 bash scripts/test.sh

  # ==========================================================================
  # Test on Windows
  # ==========================================================================
  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install chezmoi
        shell: pwsh
        run: |
          choco install chezmoi -y

      - name: Initialize chezmoi
        shell: pwsh
        run: chezmoi init --source="${{ github.workspace }}" --no-tty

      - name: Render full target state
        shell: pwsh
        run: chezmoi diff --source="${{ github.workspace }}"

      - name: Apply dotfiles (files only)
        shell: pwsh
        run: chezmoi apply --source="${{ github.workspace }}" --exclude=scripts,externals

      - name: Verify applied state
        shell: pwsh
        run: chezmoi verify --source="${{ github.workspace }}" --exclude=scripts,externals

      - name: Test install script syntax
        shell: pwsh
        run: |
          # Basic PowerShell syntax check
          $null = [System.Management.Automation.PSParser]::Tokenize((Get-Content install.ps1 -Raw), [ref]$null)
          Write-Host "PowerShell install script syntax is valid"

      - name: Run tests
        shell: pwsh
        run: |
          & .\scripts\test.ps1
        continue-on-error: true

      - name: Install uv
        shell: pwsh
        run: |
          irm https://astral.sh/uv/install.ps1 | iex
          $env:PATH = "$env:USERPROFILE\.local\bin;$env:PATH"
          uv --version

      - name: Test pdf-chunk skill
        shell: pwsh
        run: |
          $env:PATH = "$env:USERPROFILE\.local\bin;$env:PATH"
          # Test that scripts have valid syntax and can import dependencies
          uv run --script dot_claude/skills/pdf-chunk/scripts/executable_pdf_stats.py 2>&1 | Out-String
          Write-Host "pdf-chunk skill scripts are valid"
        continue-on-error: true

  # ==========================================================================
  # Template validation
  # ==========================================================================
  templates:
    name: Validate Templates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install chezmoi
        run: |
          sh -c "$(curl -fsSL https://get.chezmoi.io)" -- -b /usr/local/bin

      - name: Initialize chezmoi
        run: chezmoi init --source="${{ github.workspace }}" --no-tty

      - name: Validate templates
        run: |
          # Every .tmpl file must render with the CI machine's data
          # (non-personal/ephemeral, so 1Password calls must stay gated).
          fail=0
          while IFS= read -r file; do
            echo "Validating $file"
            flags=""
            case "$file" in
              *.chezmoi.toml.tmpl) flags="--init" ;;
            esac
            if ! chezmoi execute-template --source="${{ github.workspace }}" $flags < "$file" > /dev/null 2> "$RUNNER_TEMP/tmpl-err.txt"; then
              echo "::error file=${file}::template failed to render"
              cat "$RUNNER_TEMP/tmpl-err.txt"
              fail=1
            fi
          done < <(find . -name "*.tmpl" -not -path "./.git/*" | sort)
          exit "$fail"

      - name: Check chezmoi config (informational)
        run: |
          chezmoi doctor --source="${{ github.workspace }}" || true
