name: Test Dotfiles

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:  # Allow manual trigger

env:
  # chezmoi's gitHub* template functions call the GitHub API; runners share
  # unauthenticated rate limits, so authenticate every chezmoi invocation.
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  # ==========================================================================
  # Lint shell scripts
  # ==========================================================================
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Lint shell scripts
        run: |
          find . -name "*.sh" -not -path "./.git/*" | while read -r file; do
            echo "Checking $file"
            shellcheck "$file" || true
          done

      - name: Lint with shfmt
        uses: luizm/action-sh-checker@master
        env:
          SHFMT_OPTS: -i 4 -ci
        with:
          sh_checker_shellcheck_disable: true
          sh_checker_shfmt_disable: false
        continue-on-error: true

  # ==========================================================================
  # Test on macOS
  # ==========================================================================
  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install chezmoi
        run: |
          brew install chezmoi

      # chezmoi init does NOT persist a non-default --source, so every
      # invocation below passes it explicitly.
      - name: Initialize chezmoi
        run: chezmoi init --source="${{ github.workspace }}" --no-tty

      - name: Render full target state
        run: chezmoi diff --source="${{ github.workspace }}"

      - name: Apply dotfiles (files only)
        run: chezmoi apply --source="${{ github.workspace }}" --exclude=scripts,externals

      - name: Verify applied state
        run: chezmoi verify --source="${{ github.workspace }}" --exclude=scripts,externals

      - name: Test install script syntax
        run: |
          bash -n install.sh

      - name: Validate Brewfile syntax
        run: |
          brew bundle check --file=dot_Brewfile || true

      - name: Run tests
        run: DOTFILES_CI=1 bash scripts/test.sh

  # ==========================================================================
  # Test on Ubuntu
  # ==========================================================================
  ubuntu:
    name: Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install chezmoi
        run: |
          sh -c "$(curl -fsSL https://get.chezmoi.io)" -- -b /usr/local/bin

      - name: Initialize chezmoi
        run: chezmoi init --source="${{ github.workspace }}" --no-tty

      - name: Render full target state
        run: chezmoi diff --source="${{ github.workspace }}"

      - name: Apply dotfiles (files only)
        run: chezmoi apply --source="${{ github.workspace }}" --exclude=scripts,externals

      - name: Verify applied state
        run: chezmoi verify --source="${{ github.workspace }}" --exclude=scripts,externals

      - name: Test install script syntax
        run: |
          bash -n install.sh

      - name: Run tests
        run: DOTFILES_CI=1 bash scripts/test.sh

  # ==========================================================================
  # Test on Windows
  # ==========================================================================
  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install chezmoi
        shell: pwsh
        run: |
          choco install chezmoi -y

      - name: Initialize chezmoi
        shell: pwsh
        run: chezmoi init --source="${{ github.workspace }}" --no-tty

      - name: Render full target state
        shell: pwsh
        run: chezmoi diff --source="${{ github.workspace }}"

      - name: Apply dotfiles (files only)
        shell: pwsh
        run: chezmoi apply --source="${{ github.workspace }}" --exclude=scripts,externals

      - name: Verify applied state
        shell: pwsh
        run: chezmoi verify --source="${{ github.workspace }}" --exclude=scripts,externals

      - name: Test install script syntax
        shell: pwsh
        run: |
          # Basic PowerShell syntax check
          $null = [System.Management.Automation.PSParser]::Tokenize((Get-Content install.ps1 -Raw), [ref]$null)
          Write-Host "PowerShell install script syntax is valid"

      - name: Run tests
        shell: pwsh
        run: |
          & .\scripts\test.ps1
        continue-on-error: true

      - name: Install uv
        shell: pwsh
        run: |
          irm https://astral.sh/uv/install.ps1 | iex
          $env:PATH = "$env:USERPROFILE\.local\bin;$env:PATH"
          uv --version

      - name: Test pdf-chunk skill
        shell: pwsh
        run: |
          $env:PATH = "$env:USERPROFILE\.local\bin;$env:PATH"
          # Test that scripts have valid syntax and can import dependencies
          uv run --script dot_claude/skills/pdf-chunk/scripts/executable_pdf_stats.py 2>&1 | Out-String
          Write-Host "pdf-chunk skill scripts are valid"
        continue-on-error: true

  # ==========================================================================
  # Template validation
  # ==========================================================================
  templates:
    name: Validate Templates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install chezmoi
        run: |
          sh -c "$(curl -fsSL https://get.chezmoi.io)" -- -b /usr/local/bin

      - name: Validate templates
        run: |
          # Check that all .tmpl files are valid Go templates
          find . -name "*.tmpl" -not -path "./.git/*" | while read -r file; do
            echo "Validating $file"
            # chezmoi will fail if template is invalid
            chezmoi execute-template < "$file" > /dev/null 2>&1 || echo "  Warning: $file may have template issues (needs chezmoi data)"
          done

      - name: Check chezmoi config
        run: |
          chezmoi doctor || true
