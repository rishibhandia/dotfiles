mode = "tree-copy"
chezmoi_mappings = { "scripts/literal_keynote_audit.py" = "scripts/keynote_audit.py", "scripts/literal_keynote_bridge.py" = "scripts/keynote_bridge.py", "scripts/literal_keynote_inventory.py" = "scripts/keynote_inventory.py", "scripts/literal_keynote_layout.py" = "scripts/keynote_layout.py" }

