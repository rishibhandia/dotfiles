format = "ai-parity-manifest"
schema_version = 3
generator_version = 3

[policy]
protected_roots = ["dot_claude"]
owned_roots = ["dot_codex", "dot_agents"]
state_file = "ai-parity/generated-state.json"
journal_file = "ai-parity/.sync-journal.json"
lock_file = "ai-parity/.sync-lock"
transactions_dir = "ai-parity/.transactions"
proposals_dir = "ai-parity/.proposals"
docs_marker = "ai-parity/.docs-mcp-install.json"

[[shared_artifacts]]
name = "matlab"
canonical = "ai-parity/shared/skills/matlab"
import_mode = "direct"

[[shared_artifacts.targets]]
side = "claude"
destination = "dot_claude/skills/matlab"
mode = "tree-copy"

[[shared_artifacts.targets]]
side = "codex"
destination = "dot_agents/skills/matlab"
mode = "tree-copy"

[[shared_artifacts]]
name = "scientific-figures"
canonical = "ai-parity/shared/skills/scientific-figures"
import_mode = "direct"

[[shared_artifacts.targets]]
side = "claude"
destination = "dot_claude/skills/scientific-figures"
mode = "tree-copy"

[[shared_artifacts.targets]]
side = "codex"
destination = "dot_agents/skills/scientific-figures"
mode = "tree-copy"

[[shared_artifacts]]
name = "matlab-runner"
canonical = "ai-parity/shared/skills/matlab-runner"
import_mode = "review"

[[shared_artifacts.targets]]
side = "claude"
destination = "dot_claude/skills/matlab-runner"
mode = "tree-copy"
chezmoi_mappings = { "scripts/literal_run_matlab.sh" = "scripts/run_matlab.sh" }

[[shared_artifacts.targets]]
side = "codex"
destination = "dot_agents/skills/matlab-runner"
mode = "tree-copy"
chezmoi_mappings = { "scripts/literal_run_matlab.sh" = "scripts/run_matlab.sh" }
source_overrides = { "SKILL.md" = "ai-parity/adapters/skills/matlab-runner/SKILL.md" }

[[shared_artifacts]]
name = "zotero"
canonical = "ai-parity/shared/skills/zotero"
import_mode = "review"

[[shared_artifacts.targets]]
side = "claude"
destination = "dot_claude/skills/zotero"
mode = "tree-copy"

[[shared_artifacts.targets]]
side = "codex"
destination = "dot_agents/skills/zotero"
mode = "tree-copy"
source_overrides = { "SKILL.md" = "ai-parity/adapters/skills/zotero/SKILL.md" }

[[shared_artifacts]]
name = "pdf-chunk"
canonical = "ai-parity/shared/skills/pdf-chunk"
import_mode = "review"

[[shared_artifacts.targets]]
side = "claude"
destination = "dot_claude/skills/pdf-chunk"
mode = "tree-copy"
chezmoi_mappings = { "scripts/literal_pdf_stats.py" = "scripts/pdf_stats.py", "scripts/literal_extract_pages.py" = "scripts/extract_pages.py" }

[[shared_artifacts.targets]]
side = "codex"
destination = "dot_agents/skills/pdf-chunk"
mode = "tree-copy"
chezmoi_mappings = { "scripts/literal_pdf_stats.py" = "scripts/pdf_stats.py", "scripts/literal_extract_pages.py" = "scripts/extract_pages.py" }
source_overrides = { "SKILL.md" = "ai-parity/adapters/skills/pdf-chunk/SKILL.md" }

[[shared_artifacts]]
